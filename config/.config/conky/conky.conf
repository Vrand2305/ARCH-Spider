-- Conky minimalista transparente (reloj + clima + sistema)
conky.config = {
    alignment = 'top_left',
    gap_x = 24,
    gap_y = 24,
    minimum_width = 230,
    xinerama_head = 0,

    background = false,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_colour = '#00000000',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',

    border_width = 0,
    draw_borders = false,
    draw_shades = false,
    draw_outline = false,

    use_xft = true,
    font = 'Sans:size=10',
    xftalpha = 0.9,

    default_color = 'E8E8E8',
    color1 = '9E9E9E',

    update_interval = 1.0,
    total_run_times = 0,
    net_avg_samples = 2,
    cpu_avg_samples = 2,
    no_buffers = true,
    uppercase = false,
    pad_percents = 2,
}

conky.text = [[
${font Sans Light:size=38}${time %H:%M}${font}
${color1}${time %A %d de %B}${color}
${voffset 4}${execi 1800 curl -s --max-time 10 "wttr.in/San+Jose,Costa+Rica?format=%t+%C" 2>/dev/null}
${voffset 10}${color1}SISTEMA${color}
cpu  ${cpu}% ${cpubar 4,140}
mem  ${memperc}% ${membar 4,140}
disk  ${fs_used_perc /}% ${fs_bar 4,140}
${voffset 6}${color1}RED wlan0${color}
sub  ${downspeed wlan0}
bajada total ${totaldown wlan0}
${voffset 6}${color1}TOP${color}
${top name 1} ${top cpu 1}%
${top name 2} ${top cpu 2}%
${top name 3} ${top cpu 3}%
]]
